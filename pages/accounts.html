<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../styles/accounts.css">
<link rel="stylesheet" href="../styles/base.css">
<title>Accounts - Electronic</title>
</head>
<body class="page-fade-in">
	<div class="nav" id="nav">
		<button type="button" class="toggle-nav" id="toggleNav">
			<svg class="toggle-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
		</button>
		<img src="../res/Electronic.png" alt="Electronic Logo" class="logo" id="logo">
		<div class="nav-buttons">
			<button type="button" class="nav-btn" data-text="Basic Info" data-href="./main.html" data-theme-action="restore"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg><span>Basic</span></button>
			<button type="button" class="nav-btn active" data-text="Accounts" data-href="./accounts.html" data-theme-action="restore"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg><span>Accounts</span></button>
			<button type="button" class="nav-btn" data-text="Settings" data-href="./settings.html" data-theme-action="save"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg><span>Settings</span></button>
		</div>
	</div>

	<div class="labels" id="labels">
		<button class="labelsButton active" data-category="accounts-overview">概览</button>
		<button class="labelsButton" data-category="accounts-list">列表</button>
	</div>

	<div class="content-panel accounts-overview-panel" id="accounts-overview-panel">
		<h2>Accounts 概览</h2>
		<p>简单的账户统计示例。</p>
		<div class="info-grid">
			<div class="info-card"><h3>总用户</h3><p id="totalUsers">Loading...</p></div>
			<div class="info-card"><h3>在线用户</h3><p id="onlineUsers">Loading...</p></div>
		</div>
	</div>

	<div class="content-panel accounts-list-panel" id="accounts-list-panel">
		<h2>账户列表</h2>

		<div class="account-search-container">
			<input id="accountSearch" placeholder="搜索用户名..." class="account-search-input">
			<button id="refreshAccountsBtn" class="settings-btn">刷新</button>
			<button id="addAccountBtn" class="settings-btn">添加账户</button>
			<div class="loading-indicator" id="loadingIndicator">
				<span class="loading-text">加载中...</span>
			</div>
		</div>

		<div class="account-error" id="accountError">
			<p class="account-error-text" id="accountErrorText">获取账户列表失败</p>
			<button id="retryLoadBtn" class="settings-btn">重试</button>
		</div>

		<table class="device-table" id="accountsTable">
			<thead><tr><th>用户名</th><th>身份</th><th>状态</th><th>操作</th></tr></thead>
			<tbody id="accountsTableBody">
				<!-- 动态加载的内容将插入这里 -->
			</tbody>
		</table>
		<div class="load-more-container" id="loadMoreContainer">
			<button id="loadMoreBtn" class="settings-btn">加载更多</button>
		</div>
	</div>

	<!-- 编辑 / 添加 模态 -->
	<div id="accountModal" class="account-modal">
		<div class="account-modal-content">
			<h3 id="modalTitle">编辑账户</h3>
			<div class="account-modal-form">
				<input id="modalUsername" placeholder="用户名" class="account-modal-input">
				<input id="modalPassword" type="password" placeholder="密码" class="account-modal-input" style="display:none">
				<select id="modalRole" class="account-modal-select" title="角色" data-custom>
					<option value="admin">Administrator</option>
					<option value="user">User</option>
					<option value="guest">Guest</option>
				</select>
				<select id="modalStatus" class="account-modal-select" title="状态" data-custom>
					<option value="online">在线</option>
					<option value="offline">离线</option>
					<option value="busy">忙碌</option>
				</select>
				<div class="account-modal-buttons">
					<button id="modalCancel" class="settings-btn">取消</button>
					<button id="modalSave" class="settings-btn account-modal-save-btn">保存</button>
				</div>
			</div>
		</div>
	</div>

	<!-- 登录状态栏 -->
	<div id="loginStatus" class="login-status" style="display:none">
		<span id="loginUserDisplay"></span>
		<span id="roleBadge" class="role-badge"></span>
		<button id="logoutBtn" class="settings-btn logout-btn">退出</button>
	</div>

	<!-- 离线队列状态 -->
	<div id="offlineStatus" class="offline-status" style="display:none">
		<span id="offlineCount">有操作等待网络恢复后重试</span>
	</div>

	<script src="../scripts/base.js"></script>
	<script src="../scripts/settings-global.js"></script>
	<script src="../scripts/notification.js"></script>
	<script src="../scripts/custom-select.js"></script>
	<script src="../scripts/accounts.js"></script>
</body>
</html>
