<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - Electronic Manager</title>
    <link rel="stylesheet" href="styles/base.css">
    <style>
        body {
            padding-left: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: var(--bg-color);
            font-family: var(--font-family, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif);
        }

        .login-container {
            width: 100%;
            max-width: 400px;
            padding: 2.5rem;
            background-color: var(--panel-bg);
            border-radius: 16px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08), 0 1px 4px rgba(0, 0, 0, 0.04);
            border: 1px solid var(--border-color);
        }

        .login-logo {
            text-align: center;
            margin-bottom: 2rem;
        }

        .login-logo h1 {
            margin: 0;
            color: var(--text-color);
            font-size: 1.6rem;
            font-weight: 700;
        }

        .login-logo h1 span {
            color: var(--active-color);
        }

        .login-form {
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        .form-group label {
            font-weight: 500;
            color: var(--text-color);
            font-size: 0.9rem;
        }

        .form-control {
            padding: 0.75rem 1rem;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-size: 0.95rem;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--active-color);
            box-shadow: 0 0 0 3px rgba(79, 110, 247, 0.15);
        }

        .form-control:hover {
            border-color: var(--active-color);
        }

        .login-btn {
            padding: 0.75rem 1rem;
            background-color: var(--active-color);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-top: 0.5rem;
        }

        .login-btn:hover {
            background-color: var(--active-hover);
            box-shadow: 0 4px 12px rgba(79, 110, 247, 0.3);
        }

        .login-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .form-footer {
            text-align: center;
            margin-top: 1.2rem;
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .form-footer a {
            color: var(--active-color);
            text-decoration: none;
            font-weight: 500;
        }

        .form-footer a:hover {
            text-decoration: underline;
        }

        .error-message {
            color: #ef4444;
            font-size: 0.85rem;
            margin-top: 0.2rem;
            display: none;
        }

        @media (max-width: 480px) {
            .login-container {
                margin: 1rem;
                padding: 1.5rem;
            }
        }
    </style>
</head>
<body class="theme-light">
    <div class="login-container">
        <div class="login-logo">
            <h1><span>Electronic</span> Manager</h1>
        </div>
        
        <form class="login-form" id="loginForm">
            <div class="form-group">
                <label for="username">用户名</label>
                <input type="text" id="username-for-electronic-manager" class="form-control" placeholder="请输入用户名" required>
                <div class="error-message" id="usernameError">请输入有效的用户名</div>
            </div>
            
            <div class="form-group">
                <label for="password">密码</label>
                <input type="password" id="password-for-electronic-manager" class="form-control" placeholder="请输入密码" required>
                <div class="error-message" id="passwordError">密码不能为空</div>
            </div>
            
            <button type="submit" class="login-btn">登录</button>
        </form>
        
        <div class="form-footer">
            <p>还没有账户？<a href="./register.html" id="registerLink">立即注册</a></p>
            <p><a href="./forget.html" id="forgotPasswordLink">忘记密码？</a></p>
        </div>
    </div>

    <script>
        function getServerConfig() {
            return {
                protocol: location.protocol === 'https:' ? 'https' : 'http',
                ip: location.hostname || 'localhost',
                port: 3001
            };
        }

        document.addEventListener('DOMContentLoaded', function() {
            var loginForm = document.getElementById('loginForm');
            var usernameInput = document.getElementById('username-for-electronic-manager');
            var passwordInput = document.getElementById('password-for-electronic-manager');
            var usernameError = document.getElementById('usernameError');
            var passwordError = document.getElementById('passwordError');

            var generalError = document.createElement('div');
            generalError.className = 'error-message';
            generalError.id = 'generalError';
            generalError.style.display = 'none';
            generalError.style.textAlign = 'center';
            generalError.style.marginTop = '0.5rem';
            loginForm.querySelector('.login-btn').after(generalError);

            loginForm.addEventListener('submit', function(e) {
                e.preventDefault();

                var isValid = true;

                if (!usernameInput.value.trim()) {
                    showError(usernameInput, usernameError);
                    isValid = false;
                } else {
                    hideError(usernameInput, usernameError);
                }

                if (!passwordInput.value.trim()) {
                    showError(passwordInput, passwordError);
                    isValid = false;
                } else {
                    hideError(passwordInput, passwordError);
                }

                if (isValid) {
                    var server = getServerConfig();
                    var loginBtn = document.querySelector('.login-btn');
                    loginBtn.disabled = true;
                    loginBtn.textContent = '登录中...';
                    generalError.style.display = 'none';

                    fetch(server.protocol + '://' + server.ip + ':' + server.port + '/api/accounts/login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            username: usernameInput.value.trim(),
                            password: passwordInput.value
                        })
                    })
                        .then(function(res) { return res.json(); })
                        .then(function(data) {
                            if (data.success) {
                                localStorage.setItem('manager_auth', JSON.stringify({
                                    token: data.token,
                                    username: data.username,
                                    role: data.role
                                }));
                                window.location.href = 'pages/main.html';
                            } else {
                                generalError.textContent = data.message || '登录失败，请检查用户名和密码';
                                generalError.style.display = 'block';
                                loginBtn.disabled = false;
                                loginBtn.textContent = '登录';
                            }
                        })
                        .catch(function() {
                            generalError.textContent = '网络错误，无法连接到服务端';
                            generalError.style.display = 'block';
                            loginBtn.disabled = false;
                            loginBtn.textContent = '登录';
                        });
                }
            });

            usernameInput.addEventListener('input', function() {
                if (this.value.trim()) {
                    hideError(this, usernameError);
                }
            });

            passwordInput.addEventListener('input', function() {
                if (this.value.trim()) {
                    hideError(this, passwordError);
                }
            });

            function showError(input, errorElement) {
                input.style.borderColor = '#f44336';
                errorElement.style.display = 'block';
            }

            function hideError(input, errorElement) {
                input.style.borderColor = '';
                errorElement.style.display = 'none';
            }
        });
    </script>
</body>
</html>
